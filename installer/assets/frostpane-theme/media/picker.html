<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'nonce-__NONCE__'; script-src 'nonce-__NONCE__';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frostpane</title>
<style nonce="__NONCE__">
  /* Sized as a popup, not a page: the picker is meant to sit in its own small
     floating window, so nothing here grows to fill an editor tab. */
  :root { color-scheme: dark light; }
  body {
    margin: 0; padding: 14px 16px 16px;
    font-family: var(--vscode-font-family); font-size: 12px;
    color: var(--vscode-foreground); background: var(--vscode-editor-background);
  }
  .wrap { max-width: 302px; }
  h1 { font-size: 12px; font-weight: 600; margin: 0 0 12px; letter-spacing: 0.01em; }
  h1 .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 2px;
    background: var(--vscode-focusBorder); margin-right: 7px; vertical-align: 1px;
  }
  section { margin-bottom: 14px; }
  h2 {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.09em; opacity: 0.6; margin: 0 0 6px;
  }
  .swatches { display: flex; flex-wrap: wrap; gap: 4px; }
  .sw {
    width: 22px; height: 22px; padding: 0; border-radius: 3px; cursor: pointer;
    border: 1px solid rgba(127, 127, 127, 0.35); box-sizing: border-box;
  }
  .bg-swatches .sw { width: 32px; }
  .sw.sel { outline: 1px solid var(--vscode-focusBorder); outline-offset: 2px; }
  .sw.custom {
    display: flex; align-items: center; justify-content: center;
    background: rgba(127, 127, 127, 0.18); color: var(--vscode-foreground);
    font-size: 13px; line-height: 1;
  }
  .sw.custom:hover { background: rgba(127, 127, 127, 0.3); }
  .hidden-input {
    position: absolute; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; border: 0; padding: 0; margin: 0;
  }
  /* One segmented control, so the two scopes read as one choice. */
  .seg { display: flex; }
  .seg button {
    font: inherit; font-size: 11px; flex: 1;
    color: var(--vscode-button-secondaryForeground, inherit);
    background: var(--vscode-button-secondaryBackground, rgba(127, 127, 127, 0.16));
    border: 1px solid rgba(127, 127, 127, 0.2); border-right-width: 0;
    padding: 4px 8px; cursor: pointer;
  }
  .seg button:last-child { border-right-width: 1px; }
  .seg button:hover:not(:disabled):not(.sel) {
    background: var(--vscode-button-secondaryHoverBackground, rgba(127, 127, 127, 0.28));
  }
  .seg button.sel {
    background: var(--vscode-button-background); color: var(--vscode-button-foreground);
    border-color: var(--vscode-button-background);
  }
  .seg button:disabled { opacity: 0.4; cursor: default; }
  button.action {
    font: inherit; font-size: 11px;
    color: var(--vscode-button-secondaryForeground, inherit);
    background: var(--vscode-button-secondaryBackground, rgba(127, 127, 127, 0.16));
    border: 1px solid rgba(127, 127, 127, 0.2);
    padding: 4px 10px; cursor: pointer;
  }
  button.action:hover:not(:disabled) {
    background: var(--vscode-button-secondaryHoverBackground, rgba(127, 127, 127, 0.28));
  }
  button.action:disabled { opacity: 0.4; cursor: default; }
  .foot { display: flex; align-items: center; gap: 10px; margin: 0; }
  .hint { margin: 6px 0 0; font-size: 10px; opacity: 0.6; line-height: 1.4; }
  .foot .hint { margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot" id="dot"></span>Frostpane</h1>

  <section>
    <h2>Accent</h2>
    <div class="swatches" id="accent-swatches"></div>
  </section>

  <section>
    <h2>Background</h2>
    <div class="swatches bg-swatches" id="background-swatches"></div>
    <p class="hint">Shown brighter than they apply - the background is held dark
    so the theme stays readable.</p>
  </section>

  <section>
    <h2>Scope</h2>
    <div class="seg">
      <button id="scope-global" type="button">Global</button>
      <button id="scope-workspace" type="button">This project</button>
    </div>
    <p class="hint" id="scope-hint"></p>
  </section>

  <div class="foot">
    <button class="action" id="reset" type="button">Reset</button>
    <p class="hint">Escape closes</p>
  </div>
</div>

<input type="color" id="accent-input" class="hidden-input">
<input type="color" id="background-input" class="hidden-input">

<script nonce="__NONCE__">
(function () {
  "use strict";
  var api = acquireVsCodeApi();
  var state = null;

  var els = {
    accent: document.getElementById("accent-swatches"),
    background: document.getElementById("background-swatches"),
    accentInput: document.getElementById("accent-input"),
    backgroundInput: document.getElementById("background-input"),
    global: document.getElementById("scope-global"),
    workspace: document.getElementById("scope-workspace"),
    scopeHint: document.getElementById("scope-hint"),
    reset: document.getElementById("reset"),
  };

  function send(msg) { api.postMessage(msg); }

  // A drag across the native colour input fires continuously; trailing-edge
  // debounce keeps that from writing settings.json on every frame.
  function debounce(fn, ms) {
    var t = null;
    return function () {
      var args = arguments;
      if (t) clearTimeout(t);
      t = setTimeout(function () { t = null; fn.apply(null, args); }, ms);
    };
  }

  var setAccent = function (hex) { send({ type: "set", accent: hex }); };
  var setBackground = function (hex) { send({ type: "set", background: hex }); };
  var setAccentLive = debounce(setAccent, 200);
  var setBackgroundLive = debounce(setBackground, 200);

  els.accentInput.addEventListener("input", function () { setAccentLive(els.accentInput.value); });
  els.backgroundInput.addEventListener("input", function () { setBackgroundLive(els.backgroundInput.value); });
  els.global.addEventListener("click", function () { send({ type: "scope", value: "global" }); });
  els.workspace.addEventListener("click", function () { send({ type: "scope", value: "workspace" }); });
  els.reset.addEventListener("click", function () { send({ type: "reset" }); });

  function swatch(fill, title, selected, onClick) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sw" + (selected ? " sel" : "");
    b.style.background = fill;
    b.title = title;
    b.addEventListener("click", onClick);
    return b;
  }

  function customSwatch(input, current, isCustom) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "sw custom" + (isCustom ? " sel" : "");
    b.title = "Custom colour";
    b.textContent = isCustom ? "✎" : "+";
    if (isCustom) b.style.background = current;
    b.addEventListener("click", function () { input.value = current; input.click(); });
    return b;
  }

  function render() {
    if (!state) return;

    els.accent.textContent = "";
    var accentKnown = false;
    state.accentPresets.forEach(function (hex) {
      var sel = hex.toLowerCase() === state.accent.toLowerCase();
      if (sel) accentKnown = true;
      els.accent.appendChild(swatch(hex, hex, sel, function () { setAccent(hex); }));
    });
    els.accent.appendChild(customSwatch(els.accentInput, state.accent, !accentKnown));

    els.background.textContent = "";
    var bgKnown = false;
    state.backgroundPresets.forEach(function (p) {
      var sel = p.value.toLowerCase() === state.background.toLowerCase();
      if (sel) bgKnown = true;
      els.background.appendChild(swatch(p.display, p.value, sel, function () { setBackground(p.value); }));
    });
    els.background.appendChild(customSwatch(els.backgroundInput, state.background, !bgKnown));

    document.getElementById("dot").style.background = state.accent;
    els.global.classList.toggle("sel", state.scope === "global");
    els.workspace.classList.toggle("sel", state.scope === "workspace");
    els.workspace.disabled = !state.hasWorkspace;
    els.scopeHint.textContent = !state.hasWorkspace
      ? "No folder open, so the pick applies globally."
      : (state.scope === "workspace"
          ? "Stored in this project's .vscode/settings.json (" + state.folder + ")."
          : "Stored in your user settings, so it applies everywhere.");
    els.reset.disabled = !!state.isDefault;
  }

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") send({ type: "close" });
  });

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "state") { state = e.data.state; render(); }
  });

  send({ type: "ready" });
})();
</script>
</body>
</html>
